base: LiquidAI/LFM3-1.7B
task: sft

data:
  train: data/glia_v2_sft.jsonl
  format: chatml
  max_length: 512

training:
  epochs: 2
  batch_size: 1
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  logging_steps: 1
  save_steps: 10
  lr: 1e-4
  quantization: none
  lora:
    r: 8
    alpha: 16
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - in_proj
      - out_proj

output: output/glia_v2_sft
